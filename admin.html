<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 - 노포맛집 지도</title>
<link rel="icon" href="assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --brick: #B4451F;
    --orange: #D9822B;
    --cream: #F4EBDD;
    --ink: #2B2420;
    --line: #D8C6AC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Noto Sans KR", sans-serif; color: var(--ink); background: var(--cream);
  }
  #header {
    background: var(--brick); border-bottom: 3px solid var(--ink); padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #header h1 { margin: 0; font-family: "Black Han Sans", sans-serif; font-size: 18px; color: var(--cream); font-weight: normal; }
  #header a { color: var(--cream); font-size: 12px; text-decoration: underline; }

  #layout { display: flex; height: calc(100vh - 54px); }
  #shopListPane {
    width: 320px; flex-shrink: 0; border-right: 2px solid var(--line); overflow-y: auto; background: #fff;
    display: flex; flex-direction: column;
  }
  #shopSearch {
    width: 100%; padding: 10px 12px; border: none; border-bottom: 2px solid var(--line);
    font-family: "Noto Sans KR", sans-serif; font-size: 13px; box-sizing: border-box;
  }
  #addShopBtn {
    width: 100%; padding: 10px 12px; border: none; border-bottom: 2px solid var(--line);
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px; box-sizing: border-box;
    background: var(--brick); color: var(--cream); cursor: pointer;
  }
  #shopTabs {
    display: flex; border-bottom: 2px solid var(--line);
  }
  #shopTabs .shopTab {
    flex: 1; padding: 8px 4px; border: none; border-right: 1px solid var(--line);
    background: #fff; font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12px;
    color: var(--ink); cursor: pointer;
  }
  #shopTabs .shopTab:last-child { border-right: none; }
  #shopTabs .shopTab.active { background: var(--cream); color: var(--brick); }
  .shopRow .customMark { color: var(--orange); font-weight: 700; }
  .shopRow.selected .customMark { color: var(--cream); }
  #deleteShopBtn {
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    padding: 8px 14px; border: 2px solid var(--brick); border-radius: 20px; background: var(--cream);
    color: var(--brick); margin-left: 8px;
  }
  #basicFields input[type=text], #basicFields select {
    width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 13px;
    font-family: "Noto Sans KR", sans-serif; box-sizing: border-box;
  }
  #basicFields .field { margin-bottom: 14px; }
  .shopRow {
    padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px;
  }
  .shopRow:hover { background: #FBF4EA; }
  .shopRow.selected { background: var(--brick); color: var(--cream); }
  .shopRow .addr { font-size: 11px; color: #6B5C4E; }
  .shopRow.selected .addr { color: #F0C9A9; }
  .shopRow .overrideMark { color: var(--brick); font-weight: 700; }
  .shopRow.selected .overrideMark { color: var(--cream); }

  #editPane { flex: 1; padding: 24px 32px; overflow-y: auto; }
  #editPane h2 { font-size: 18px; margin: 0 0 4px; }
  #editPane .addr { font-size: 13px; color: #6B5C4E; margin-bottom: 20px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }

  #menuRows .menuRow { display: flex; gap: 8px; margin-bottom: 6px; }
  #menuRows input[type=text] {
    padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 13px;
    font-family: "Noto Sans KR", sans-serif;
  }
  #menuRows .menuName { flex: 1; }
  #menuRows .menuPrice { width: 120px; }
  #menuRows button.removeRow {
    border: none; background: none; color: var(--brick); font-size: 18px; cursor: pointer; padding: 0 6px;
  }
  #addMenuRow, #saveBtn, #photoUpload label {
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    padding: 8px 14px; border: 2px solid var(--ink); border-radius: 20px; background: var(--cream);
  }
  #saveBtn { background: var(--brick); border-color: var(--brick); color: var(--cream); }

  #photoGrid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  #photoGrid .photoItem { position: relative; width: 100px; height: 100px; }
  #photoGrid img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 2px solid var(--ink); }
  #photoGrid .removePhoto {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-size: 13px;
  }

  .empty { color: #6B5C4E; font-size: 14px; padding: 40px; text-align: center; }
  .notAdmin { padding: 60px 20px; text-align: center; font-size: 14px; color: #6B5C4E; }
  #status { font-size: 12px; color: #6B5C4E; margin-left: 10px; }
</style>
</head>
<body>
<div id="header">
  <h1>노포맛집지도 관리자</h1>
  <a href="index.html">← 지도로</a>
</div>
<div id="layout" style="display:none;">
  <div id="shopListPane">
    <button type="button" id="addShopBtn">+ 새 가게 등록</button>
    <div id="shopTabs">
      <button type="button" class="shopTab active" data-tab="all">전체</button>
      <button type="button" class="shopTab" data-tab="baeknyeon">백년가게</button>
      <button type="button" class="shopTab" data-tab="oraegage">오래가게</button>
      <button type="button" class="shopTab" data-tab="custom">등록가게</button>
    </div>
    <input id="shopSearch" type="text" placeholder="가게명 검색">
    <div id="shopList"></div>
  </div>
  <div id="editPane">
    <div class="empty">왼쪽에서 가게를 선택하세요.</div>
  </div>
</div>
<div id="notAdminArea"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4049230daf71eeaa331a033be7ed6920&autoload=false&libraries=services"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, getDocs, collection,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDC97LjxznZ_pEUP0RkRxHMZ4UQul9HiEA",
  authDomain: "nopo-matjip-map.firebaseapp.com",
  projectId: "nopo-matjip-map",
  storageBucket: "nopo-matjip-map.firebasestorage.app",
  messagingSenderId: "1009076485496",
  appId: "1:1009076485496:web:7438ed95e1a738f8ca1c8d",
};
const ADMIN_EMAIL = "cmkim84@ajunews.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);
const googleProvider = new GoogleAuthProvider();

const layout = document.getElementById("layout");
const notAdminArea = document.getElementById("notAdminArea");
const shopListEl = document.getElementById("shopList");
const shopSearchEl = document.getElementById("shopSearch");
const editPane = document.getElementById("editPane");

const FOOD_CATEGORIES = ["한식", "고기/구이", "해산물", "일식", "중식", "양식", "분식/면류", "카페/베이커리", "기타"];
const GRADES = ["찐노포", "동네 터줏대감"];

let allShops = [];
let overrideCache = {};
let selectedShop = null;
let currentPhotos = [];
let kakaoReady = null;
let activeTab = "all";

function ensureKakao() {
  if (!kakaoReady) kakaoReady = new Promise(resolve => kakao.maps.load(resolve));
  return kakaoReady;
}

async function geocodeAddress(address) {
  await ensureKakao();
  return new Promise(resolve => {
    new kakao.maps.services.Geocoder().addressSearch(address, (result, status) => {
      if (status === kakao.maps.services.Status.OK && result[0]) {
        resolve({ lat: Number(result[0].y), lng: Number(result[0].x) });
      } else {
        resolve(null);
      }
    });
  });
}

function renderShopList(filter) {
  const q = (filter || "").trim();
  let list = allShops;
  if (activeTab === "baeknyeon") list = list.filter(s => s.source && s.source.includes("백년가게"));
  if (activeTab === "oraegage") list = list.filter(s => s.source && s.source.includes("오래가게"));
  if (activeTab === "custom") list = list.filter(s => s.isCustom);
  if (q) list = list.filter(s => s.name.includes(q));
  shopListEl.innerHTML = list.slice(0, 300).map(s => `
    <div class="shopRow${selectedShop && selectedShop.id === s.id ? " selected" : ""}" data-id="${s.id}">
      <div>${s.name} ${s.isCustom ? '<span class="customMark">등록</span>' : (overrideCache[s.id] ? '<span class="overrideMark">●</span>' : "")}</div>
      <div class="addr">${s.address}</div>
    </div>
  `).join("");
  shopListEl.querySelectorAll(".shopRow").forEach(row => {
    row.addEventListener("click", () => selectShop(row.dataset.id));
  });
}

function menuRowHtml(name = "", price = "") {
  return `
    <div class="menuRow">
      <input type="text" class="menuName" placeholder="메뉴명" value="${name}">
      <input type="text" class="menuPrice" placeholder="가격 (예: 12,000원)" value="${price}">
      <button type="button" class="removeRow">×</button>
    </div>
  `;
}

function basicFieldsHtml(shop) {
  return `
    <div id="basicFields">
      <div class="field">
        <label>가게명</label>
        <input type="text" id="fName" value="${shop.name || ""}">
      </div>
      <div class="field">
        <label>주소</label>
        <input type="text" id="fAddress" value="${shop.address || ""}">
      </div>
      <div class="field">
        <label>전화번호</label>
        <input type="text" id="fPhone" value="${shop.phone || ""}">
      </div>
      <div class="field">
        <label>업종</label>
        <select id="fCategory">
          ${FOOD_CATEGORIES.map(c => `<option value="${c}" ${shop.foodCategory === c ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>등급</label>
        <select id="fGrade">
          ${GRADES.map(g => `<option value="${g}" ${shop.grade === g ? "selected" : ""}>${g}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>영업시간</label>
        <input type="text" id="fHours" value="${shop.hours || ""}">
      </div>
      <div class="field">
        <label>소개</label>
        <input type="text" id="fIntro" value="${shop.intro || ""}">
      </div>
    </div>
  `;
}

function selectNewShop() {
  selectedShop = { id: crypto.randomUUID(), isCustom: true, isNew: true, name: "" };
  currentPhotos = [];
  renderEditPane({ menu: [], photos: [] });
}

async function selectShop(id) {
  selectedShop = allShops.find(s => s.id === id);
  renderShopList(shopSearchEl.value);

  if (selectedShop.isCustom) {
    currentPhotos = selectedShop.photos || [];
    renderEditPane(selectedShop);
    return;
  }

  const snap = await getDoc(doc(db, "shopOverrides", id));
  const override = snap.exists() ? snap.data() : { menu: [], photos: [] };
  currentPhotos = override.photos || [];
  renderEditPane(override);
}

function renderEditPane(data) {
  const showBasicFields = selectedShop.isCustom;
  editPane.innerHTML = `
    ${showBasicFields ? basicFieldsHtml(selectedShop) : `
      <h2>${selectedShop.name}</h2>
      <div class="addr">${selectedShop.address}</div>
    `}

    <div class="field">
      <label>메뉴 / 가격</label>
      <div id="menuRows"></div>
      <button type="button" id="addMenuRow">+ 메뉴 추가</button>
    </div>

    <div class="field">
      <label>사진</label>
      <div id="photoGrid"></div>
      <label id="photoUpload">
        사진 업로드
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
      </label>
    </div>

    <button type="button" id="saveBtn">저장</button>
    ${selectedShop.isCustom && !selectedShop.isNew ? `<button type="button" id="deleteShopBtn">가게 삭제</button>` : ""}
    <span id="status"></span>
  `;

  const menuRows = document.getElementById("menuRows");
  const menu = data.menu && data.menu.length ? data.menu : [{ name: "", price: "" }];
  menu.forEach(m => menuRows.insertAdjacentHTML("beforeend", menuRowHtml(m.name, m.price)));
  wireMenuRowRemovers();

  document.getElementById("addMenuRow").addEventListener("click", () => {
    menuRows.insertAdjacentHTML("beforeend", menuRowHtml());
    wireMenuRowRemovers();
  });

  renderPhotoGrid();
  document.getElementById("photoInput").addEventListener("change", handlePhotoUpload);
  document.getElementById("saveBtn").addEventListener("click", saveOverride);
  const delBtn = document.getElementById("deleteShopBtn");
  if (delBtn) delBtn.addEventListener("click", deleteCustomShop);
}

function wireMenuRowRemovers() {
  document.querySelectorAll("#menuRows .removeRow").forEach(btn => {
    btn.onclick = () => btn.closest(".menuRow").remove();
  });
}

function renderPhotoGrid() {
  const grid = document.getElementById("photoGrid");
  grid.innerHTML = currentPhotos.map((url, i) => `
    <div class="photoItem">
      <img src="${url}">
      <button type="button" class="removePhoto" data-i="${i}">×</button>
    </div>
  `).join("");
  grid.querySelectorAll(".removePhoto").forEach(btn => {
    btn.addEventListener("click", () => {
      currentPhotos.splice(Number(btn.dataset.i), 1);
      renderPhotoGrid();
    });
  });
}

async function handlePhotoUpload(e) {
  const files = Array.from(e.target.files || []);
  const statusEl = document.getElementById("status");
  for (const file of files) {
    statusEl.textContent = `업로드 중... (${file.name})`;
    const path = `shopPhotos/${selectedShop.id}/${Date.now()}-${file.name}`;
    const storageRef = ref(storage, path);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);
    currentPhotos.push(url);
  }
  statusEl.textContent = "";
  e.target.value = "";
  renderPhotoGrid();
}

async function saveOverride() {
  const menu = Array.from(document.querySelectorAll("#menuRows .menuRow")).map(row => ({
    name: row.querySelector(".menuName").value.trim(),
    price: row.querySelector(".menuPrice").value.trim(),
  })).filter(m => m.name);

  const statusEl = document.getElementById("status");

  if (selectedShop.isCustom) {
    const name = document.getElementById("fName").value.trim();
    const address = document.getElementById("fAddress").value.trim();
    if (!name || !address) {
      statusEl.textContent = "가게명과 주소는 필수예요.";
      return;
    }
    statusEl.textContent = "주소 확인 중...";
    const coords = await geocodeAddress(address);
    if (!coords) {
      statusEl.textContent = "주소를 찾을 수 없어요. 다시 확인해주세요.";
      return;
    }

    const shopData = {
      name, address,
      phone: document.getElementById("fPhone").value.trim(),
      foodCategory: document.getElementById("fCategory").value,
      grade: document.getElementById("fGrade").value,
      hours: document.getElementById("fHours").value.trim(),
      intro: document.getElementById("fIntro").value.trim(),
      lat: coords.lat, lng: coords.lng,
      menu, photos: currentPhotos,
      updatedAt: new Date().toISOString(),
    };
    await setDoc(doc(db, "customShops", selectedShop.id), shopData);

    const existing = allShops.findIndex(s => s.id === selectedShop.id);
    const updatedShop = { ...shopData, id: selectedShop.id, isCustom: true };
    if (existing >= 0) allShops[existing] = updatedShop; else allShops.push(updatedShop);
    selectedShop = updatedShop;
  } else {
    await setDoc(doc(db, "shopOverrides", selectedShop.id), {
      menu, photos: currentPhotos, updatedAt: new Date().toISOString(),
    });
    overrideCache[selectedShop.id] = true;
  }

  renderShopList(shopSearchEl.value);
  statusEl.textContent = "저장됐어요!";
  setTimeout(() => { document.getElementById("status").textContent = ""; }, 2000);
}

async function deleteCustomShop() {
  if (!confirm(`'${selectedShop.name}'을(를) 삭제할까요? 되돌릴 수 없어요.`)) return;
  await deleteDoc(doc(db, "customShops", selectedShop.id));
  allShops = allShops.filter(s => s.id !== selectedShop.id);
  selectedShop = null;
  editPane.innerHTML = `<div class="empty">왼쪽에서 가게를 선택하세요.</div>`;
  renderShopList(shopSearchEl.value);
}

shopSearchEl.addEventListener("input", () => renderShopList(shopSearchEl.value));
document.getElementById("addShopBtn").addEventListener("click", selectNewShop);
document.querySelectorAll("#shopTabs .shopTab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#shopTabs .shopTab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    renderShopList(shopSearchEl.value);
  });
});

async function init() {
  const res = await fetch("data/노포.json");
  const baseShops = await res.json();
  const customSnap = await getDocs(collection(db, "customShops")).catch(() => ({ forEach: () => {} }));
  const customShops = [];
  customSnap.forEach(d => customShops.push({ ...d.data(), id: d.id, isCustom: true }));
  allShops = baseShops.concat(customShops);
  renderShopList("");
}

onAuthStateChanged(auth, async (user) => {
  if (!user || user.email !== ADMIN_EMAIL) {
    layout.style.display = "none";
    notAdminArea.innerHTML = `
      <div class="notAdmin">
        관리자만 접근할 수 있어요.
        <br><button id="loginBtn" style="margin-top:12px;font-family:'Noto Sans KR',sans-serif;font-weight:700;padding:10px 18px;border:2px solid var(--ink);border-radius:20px;background:var(--cream);cursor:pointer;">Google로 로그인</button>
      </div>
    `;
    const btn = document.getElementById("loginBtn");
    if (btn) btn.addEventListener("click", () => signInWithPopup(auth, googleProvider));
    return;
  }
  notAdminArea.innerHTML = "";
  layout.style.display = "flex";
  init();
});
</script>
</body>
</html>
