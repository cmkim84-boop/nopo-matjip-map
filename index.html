<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>노포맛집 지도</title>
<meta name="description" content="우연히 만나는 동네 노포">
<meta property="og:title" content="노포맛집지도">
<meta property="og:description" content="우연히 만나는 동네 노포">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B4451F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --brick: #B4451F;
    --orange: #D9822B;
    --cream: #F4EBDD;
    --ink: #2B2420;
    --line: #D8C6AC;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100dvh; overflow: hidden;
    font-family: "Noto Sans KR", sans-serif; color: var(--ink);
  }
  body { display: flex; flex-direction: column; }
  #map { flex: 1; min-height: 0; width: 100%; }

  #header {
    background: var(--brick); border-bottom: 3px solid var(--ink);
    padding: 10px 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    box-shadow: 0 3px 8px rgba(43,36,32,.25); flex-shrink: 0;
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .headerTitle { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; min-width: 0; }
  #header h1 {
    margin: 0; font-family: "Black Han Sans", sans-serif; font-size: 27px;
    color: var(--cream); letter-spacing: .5px; font-weight: normal; line-height: 1;
  }
  #header p {
    margin: 0; font-family: "Noto Serif KR", serif; font-size: 11px; color: #F0C9A9; line-height: 1.4;
  }
  #authArea { flex-shrink: 0; }
  #authArea button, #authArea a.myBtn {
    display: inline-block; font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12px;
    padding: 7px 14px; border: 1.5px solid var(--cream); border-radius: 16px;
    background: transparent; color: var(--cream); cursor: pointer; text-decoration: none;
  }

  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    background: var(--cream); border-bottom: 2px solid var(--ink);
    padding: 8px 10px; overflow-x: auto;
  }
  #toolbar button {
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px;
    min-height: 40px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 20px;
    background: var(--cream); color: var(--ink); cursor: pointer; flex-shrink: 0;
    white-space: nowrap;
  }
  #toolbar button.active { background: var(--brick); color: var(--cream); border-color: var(--brick); }
  #locateBtn { margin-left: auto; }

  #legend {
    display: flex; gap: 14px; flex-shrink: 0;
    background: var(--cream); border-bottom: 2px solid var(--line);
    padding: 6px 12px; font-size: 11px;
  }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  #categoryBar {
    display: flex; gap: 6px; flex-shrink: 0;
    background: var(--cream); border-bottom: 2px solid var(--line);
    padding: 8px 10px; overflow-x: auto;
  }
  #categoryBar button {
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12px;
    min-height: 32px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 16px;
    background: #fff; color: #6B5C4E; cursor: pointer; flex-shrink: 0; white-space: nowrap;
  }
  #categoryBar button.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--cream); border-top: 3px solid var(--ink);
    border-radius: 14px 14px 0 0; box-shadow: 0 -4px 10px rgba(43,36,32,.3);
    padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .25s ease-out;
    max-height: 45vh; overflow-y: auto;
  }
  #sheet.open { transform: translateY(0); }
  #sheet .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  #sheet .name { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 18px; }
  #sheet .badge { background: var(--brick); color: var(--cream); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  #sheet .sub { color: #6B5C4E; font-size: 12px; margin-top: 4px; }
  #sheet hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #sheet .info { font-size: 14px; line-height: 1.8; }
  #sheet .intro { font-size: 13px; line-height: 1.7; color: #4A3F35; margin-top: 10px; }
  #sheet .amenities { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  #sheet .amenities span {
    font-size: 11px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; color: #6B5C4E;
  }
  #sheet .photos { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  #sheet .photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 2px solid var(--ink); flex-shrink: 0; }
  #sheet .menu { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  #sheet .menuItem { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  #sheet .menuItem span:last-child { color: #6B5C4E; }
  #sheet .actions { display: flex; gap: 8px; margin-top: 14px; }
  #sheet .actions a, #sheet .actions button {
    flex: 1; text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer;
    font-family: "Noto Sans KR", sans-serif;
  }
  #sheet .dirBtn { border: 2px solid var(--ink); color: var(--ink); background: none; }
  #sheet .shareBtn { background: var(--brick); border: 2px solid var(--brick); color: var(--cream); }
  #sheet .favBtn { border: 2px solid var(--brick); color: var(--brick); background: none; }
  #sheet .favBtn.on { background: var(--brick); color: var(--cream); }
  #sheet .visitBtn { border: 2px solid var(--ink); color: var(--ink); background: none; }
  #sheet .visitBtn.on { background: var(--ink); color: var(--cream); }
  #sheet .close {
    width: 32px; height: 32px; flex-shrink: 0; border: 2px solid var(--ink); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
    background: none; color: var(--ink); cursor: pointer;
  }

  @keyframes pulse {
    0%   { transform: scale(0.6); opacity: 0.55; }
    70%  { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .myLocation { position: relative; width: 18px; height: 18px; }
  .myLocation .pulseRing {
    position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; border-radius: 50%;
    background: var(--ink); opacity: 0.5;
    animation: pulse 2.2s ease-out infinite;
  }
  .myLocation .dot {
    position: absolute; top: 0; left: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--cream);
    box-shadow: 0 2px 4px rgba(43,36,32,.4);
  }
</style>
</head>
<body>
<div id="header">
  <div class="headerTitle">
    <h1>노포맛집지도</h1>
    <p>우연히 만나는 동네 노포</p>
  </div>
  <div id="authArea"></div>
</div>
<div id="toolbar">
  <button data-radius="500" class="active">500m</button>
  <button data-radius="750">750m</button>
  <button data-radius="1000">1000m</button>
  <button id="locateBtn">현재 위치</button>
</div>
<div id="legend">
  <div><span class="dot" style="background: var(--orange);"></span>동네 터줏대감 10~20년</div>
  <div><span class="dot" style="background: var(--brick);"></span>찐노포 20년~</div>
</div>
<div id="categoryBar">
  <button data-category="all" class="active">전체</button>
  <button data-category="한식">한식</button>
  <button data-category="고기/구이">고기/구이</button>
  <button data-category="해산물">해산물</button>
  <button data-category="일식">일식</button>
  <button data-category="중식">중식</button>
  <button data-category="양식">양식</button>
  <button data-category="분식/면류">분식/면류</button>
  <button data-category="카페/베이커리">카페/베이커리</button>
  <button data-category="기타">기타</button>
  <button id="favOnlyBtn" data-category="__fav__">★ 즐겨찾기만</button>
</div>
<div id="map"></div>
<div id="sheet"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4049230daf71eeaa331a033be7ed6920&autoload=false&libraries=services,clusterer"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, deleteDoc, getDoc, getDocs, collection, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDC97LjxznZ_pEUP0RkRxHMZ4UQul9HiEA",
  authDomain: "nopo-matjip-map.firebaseapp.com",
  projectId: "nopo-matjip-map",
  storageBucket: "nopo-matjip-map.firebasestorage.app",
  messagingSenderId: "1009076485496",
  appId: "1:1009076485496:web:7438ed95e1a738f8ca1c8d",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();

let currentUser = null;
let favoriteIds = new Set();
let visitCounts = {};

const authArea = document.getElementById("authArea");

function renderAuthArea() {
  if (currentUser) {
    authArea.innerHTML = `<a class="myBtn" href="my.html">MY</a>`;
  } else {
    authArea.innerHTML = `<button id="loginBtn">Google로 로그인</button>`;
    document.getElementById("loginBtn").addEventListener("click", () => signInWithPopup(auth, googleProvider));
  }
}

async function loadUserData() {
  favoriteIds = new Set();
  visitCounts = {};
  if (!currentUser) return;
  const favSnap = await getDocs(collection(db, "users", currentUser.uid, "favorites"));
  favSnap.forEach(d => favoriteIds.add(d.id));
  const visitSnap = await getDocs(collection(db, "users", currentUser.uid, "visits"));
  visitSnap.forEach(d => { visitCounts[d.id] = d.data().count || 0; });
}

async function toggleFavorite(shop) {
  if (!currentUser) { signInWithPopup(auth, googleProvider); return; }
  const ref = doc(db, "users", currentUser.uid, "favorites", shop.id);
  if (favoriteIds.has(shop.id)) {
    await deleteDoc(ref);
    favoriteIds.delete(shop.id);
  } else {
    await setDoc(ref, { name: shop.name, address: shop.address, addedAt: serverTimestamp() });
    favoriteIds.add(shop.id);
  }
  openSheet(shop);
  if (favOnly) renderMarkers();
}

async function markVisited(shop) {
  if (!currentUser) { signInWithPopup(auth, googleProvider); return; }
  const ref = doc(db, "users", currentUser.uid, "visits", shop.id);
  const snap = await getDoc(ref);
  const nextCount = (snap.exists() ? snap.data().count || 0 : 0) + 1;
  await setDoc(ref, { name: shop.name, count: nextCount, lastVisitedAt: serverTimestamp() });
  visitCounts[shop.id] = nextCount;
  openSheet(shop);
}

renderAuthArea();

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  renderAuthArea();
  await loadUserData();
  if (clusterer) renderMarkers();
  if (openSheetShop) openSheet(openSheetShop);
});

const DEFAULT_CENTER = { lat: 37.3800, lng: 126.8030 }; // 시흥시청 근처 fallback

let map, myPos = null, filterCenter = DEFAULT_CENTER, radius = 500;
let category = "all";
let favOnly = false;
let allShops = [];
let markers = [];
let clusterer;
const sheet = document.getElementById("sheet");
let openSheetShop = null;

function openSheet(shop) {
  openSheetShop = shop;
  const dirUrl = `https://map.kakao.com/link/to/${encodeURIComponent(shop.name)},${shop.lat},${shop.lng}`;
  const telHtml = shop.phone ? `<a href="tel:${shop.phone}">${shop.phone}</a>` : "정보 없음";
  const shareUrl = `https://map.kakao.com/link/map/${encodeURIComponent(shop.name)},${shop.lat},${shop.lng}`;
  const badgeColor = shop.grade === "찐노포" ? "var(--brick)" : "var(--orange)";
  const yearsText = shop.yearsOpen ? `${shop.yearsOpen}년째 영업` : "";
  const hoursHtml = shop.hours ? `<br>영업시간: ${shop.hours}` : "";
  const introHtml = shop.intro ? `<div class="intro">${shop.intro}</div>` : "";
  const amenitiesHtml = shop.amenities && shop.amenities.length
    ? `<div class="amenities">${shop.amenities.map(a => `<span>${a}</span>`).join("")}</div>`
    : "";
  const photosHtml = shop.photos && shop.photos.length
    ? `<div class="photos">${shop.photos.map(url => `<img src="${url}">`).join("")}</div>`
    : "";
  const menuHtml = shop.menu && shop.menu.length
    ? `<div class="menu">${shop.menu.map(m => `<div class="menuItem"><span>${m.name}</span><span>${m.price || ""}</span></div>`).join("")}</div>`
    : "";
  const isFav = favoriteIds.has(shop.id);
  const visitCount = visitCounts[shop.id] || 0;
  const visitText = visitCount > 0 ? `다녀왔어요 (${visitCount})` : "다녀왔어요";
  sheet.innerHTML = `
    <div class="row">
      <div>
        <div class="row" style="align-items:center;gap:8px;">
          <span class="name">${shop.name}</span>
          <span class="badge" style="background:${badgeColor};">${shop.grade}</span>
        </div>
        <div class="sub">${yearsText}</div>
      </div>
      <button class="close" aria-label="닫기">×</button>
    </div>
    <hr>
    <div class="info">${shop.address}<br>전화: ${telHtml}${hoursHtml}</div>
    ${introHtml}
    ${photosHtml}
    ${menuHtml}
    ${amenitiesHtml}
    <div class="actions">
      <button class="favBtn${isFav ? " on" : ""}">${isFav ? "★ 즐겨찾기됨" : "☆ 즐겨찾기"}</button>
      <button class="visitBtn${visitCount > 0 ? " on" : ""}">${visitText}</button>
    </div>
    <div class="actions">
      <a class="dirBtn" href="${dirUrl}" target="_blank">길찾기</a>
      <a class="shareBtn" href="${shareUrl}" target="_blank">카카오맵 공유</a>
    </div>
  `;
  sheet.querySelector(".close").addEventListener("click", closeSheet);
  sheet.querySelector(".favBtn").addEventListener("click", () => toggleFavorite(shop));
  sheet.querySelector(".visitBtn").addEventListener("click", () => markVisited(shop));
  sheet.classList.add("open");
}

function closeSheet() {
  sheet.classList.remove("open");
  openSheetShop = null;
}

function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const markerImageCache = {};
function markerImage(grade) {
  if (markerImageCache[grade]) return markerImageCache[grade];
  const color = grade === "찐노포" ? "B4451F" : "D9822B";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="42" height="52" viewBox="0 0 42 52">
    <ellipse cx="21" cy="47" rx="8" ry="2.5" fill="#2B2420" opacity="0.22"/>
    <path d="M21 2C11.6 2 4 9.6 4 19c0 13.5 17 27 17 27s17-13.5 17-27C38 9.6 30.4 2 21 2z" fill="#${color}" stroke="#F4EBDD" stroke-width="3"/>
    <circle cx="21" cy="19" r="11.5" fill="#F4EBDD"/>
    <g stroke="#${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="16.5" y1="12.5" x2="16.5" y2="26"/>
      <line x1="14.5" y1="12.5" x2="14.5" y2="18"/>
      <line x1="18.5" y1="12.5" x2="18.5" y2="18"/>
      <path d="M14.5 18 Q16.5 20 18.5 18"/>
      <path d="M25.5 12.5 L25.5 26 M25.5 12.5 Q23.3 14.5 25.5 19"/>
    </g>
  </svg>`;
  const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  const image = new kakao.maps.MarkerImage(url, new kakao.maps.Size(42, 52), { offset: new kakao.maps.Point(21, 52) });
  markerImageCache[grade] = image;
  return image;
}

let locationOverlay = null;

function updateLocationOverlay(lat, lng) {
  if (!locationOverlay) {
    const el = document.createElement("div");
    el.className = "myLocation";
    el.innerHTML = `<div class="pulseRing"></div><div class="dot"></div>`;
    locationOverlay = new kakao.maps.CustomOverlay({
      content: el,
      position: new kakao.maps.LatLng(lat, lng),
      xAnchor: 0.5,
      yAnchor: 0.5,
      zIndex: 5,
    });
    locationOverlay.setMap(map);
  } else {
    locationOverlay.setPosition(new kakao.maps.LatLng(lat, lng));
  }
}

function buildMarkers() {
  allShops.forEach(shop => {
    if (shop.marker) return;
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(shop.lat, shop.lng),
      image: markerImage(shop.grade),
    });
    kakao.maps.event.addListener(marker, "click", () => openSheet(shop));
    shop.marker = marker;
  });
}

function renderMarkers() {
  clusterer.clear();
  const inRange = allShops.filter(s =>
    distanceM(filterCenter.lat, filterCenter.lng, s.lat, s.lng) <= radius &&
    (category === "all" || s.foodCategory === category) &&
    (!favOnly || favoriteIds.has(s.id))
  );

  markers = inRange.map(s => s.marker);
  clusterer.addMarkers(markers);
  document.title = `노포맛집 지도 (${inRange.length}곳)`;
}

function panTo(lat, lng) {
  map.setCenter(new kakao.maps.LatLng(lat, lng));
}

function goToMyLocation(lat, lng) {
  myPos = { lat, lng };
  updateLocationOverlay(lat, lng);
  panTo(lat, lng);
}

function initMap() {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(filterCenter.lat, filterCenter.lng),
    level: 5,
  });
  kakao.maps.event.addListener(map, "click", closeSheet);
  kakao.maps.event.addListener(map, "idle", () => {
    const c = map.getCenter();
    filterCenter = { lat: c.getLat(), lng: c.getLng() };
    renderMarkers();
  });
  clusterer = new kakao.maps.MarkerClusterer({
    map,
    averageCenter: true,
    minLevel: 6,
    gridSize: 60,
  });

  Promise.all([
    fetch("data/노포_백년가게.json").then(r => r.json()),
    getDocs(collection(db, "shopOverrides")),
    getDocs(collection(db, "customShops")).catch(() => ({ forEach: () => {} })),
  ])
    .then(([data, overrideSnap, customSnap]) => {
      const overrides = {};
      overrideSnap.forEach(d => { overrides[d.id] = d.data(); });
      const customShops = [];
      customSnap.forEach(d => customShops.push({ ...d.data(), id: d.id }));
      allShops = data.map(s => overrides[s.id] ? { ...s, ...overrides[s.id] } : s).concat(customShops);
      buildMarkers();
      renderMarkers();
      const focusId = new URLSearchParams(location.search).get("focus");
      const focusShop = focusId && allShops.find(s => s.id === focusId);
      if (focusShop) {
        radius = 1000;
        document.querySelectorAll("#toolbar button[data-radius]").forEach(b =>
          b.classList.toggle("active", b.dataset.radius === "1000"));
        panTo(focusShop.lat, focusShop.lng);
        map.setLevel(4);
        openSheet(focusShop);
      }
    });

  if (new URLSearchParams(location.search).get("focus")) return;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => goToMyLocation(pos.coords.latitude, pos.coords.longitude),
      () => {} // 위치 거부 시 기본 위치로 진행
    );
  }
}

document.querySelectorAll("#categoryBar button[data-category]:not(#favOnlyBtn)").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#categoryBar button[data-category]:not(#favOnlyBtn)").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    category = btn.dataset.category;
    renderMarkers();
  });
});

document.getElementById("favOnlyBtn").addEventListener("click", function () {
  if (!currentUser) { signInWithPopup(auth, googleProvider); return; }
  favOnly = !favOnly;
  this.classList.toggle("active", favOnly);
  renderMarkers();
});

document.querySelectorAll("#toolbar button[data-radius]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#toolbar button[data-radius]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    radius = Number(btn.dataset.radius);
    renderMarkers();
  });
});

document.getElementById("locateBtn").addEventListener("click", function () {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => goToMyLocation(pos.coords.latitude, pos.coords.longitude),
    err => console.error(err),
    { enableHighAccuracy: true }
  );
});

kakao.maps.load(initMap);
</script>
</body>
