<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노포맛집 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --brick: #B4451F;
    --orange: #D9822B;
    --cream: #F4EBDD;
    --ink: #2B2420;
    --line: #D8C6AC;
  }
  html, body { margin: 0; height: 100%; font-family: "Noto Sans KR", sans-serif; color: var(--ink); }
  #map { width: 100%; height: 100%; }

  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    background: var(--brick); border-bottom: 3px solid var(--ink);
    padding: 14px 18px 16px; box-shadow: 0 3px 8px rgba(43,36,32,.25);
  }
  #header h1 {
    margin: 0; font-family: "Black Han Sans", sans-serif; font-size: 22px;
    color: var(--cream); letter-spacing: .5px; font-weight: normal;
  }
  #header p {
    margin: 2px 0 0; font-family: "Noto Serif KR", serif; font-size: 12px; color: #F0C9A9;
  }

  #legend {
    position: absolute; top: 78px; right: 12px; z-index: 10;
    background: var(--cream); border: 2px solid var(--ink); border-radius: 4px;
    padding: 8px 10px; font-size: 11px; line-height: 1.8;
    box-shadow: 0 2px 4px rgba(43,36,32,.2);
  }
  #legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

  #controls {
    position: absolute; top: 78px; left: 12px; z-index: 10; width: 168px;
    background: var(--cream); padding: 12px; border: 2px solid var(--ink); border-radius: 6px;
    box-shadow: 0 3px 6px rgba(43,36,32,.25);
  }
  #controls .label { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  #controls .radiusRow { display: flex; gap: 6px; margin-bottom: 10px; }
  #controls hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
  #controls button {
    font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12px;
    padding: 8px 6px; border: 2px solid var(--ink); border-radius: 4px;
    background: var(--cream); color: var(--ink); cursor: pointer;
  }
  #controls .radiusRow button { flex: 1; }
  #controls button.active { background: var(--brick); color: var(--cream); border-color: var(--brick); }
  #trackBtn { width: 100%; }
  #trackBtn.on { background: var(--brick); color: var(--cream); border-color: var(--brick); }
</style>
</head>
<body>
<div id="header">
  <h1>노포맛집지도</h1>
  <p>우연히 만나는 동네 노포</p>
</div>
<div id="legend">
  <div><span class="dot" style="background: var(--orange);"></span>동네 터줏대감 10~20년</div>
  <div><span class="dot" style="background: var(--brick);"></span>찐노포 20년~</div>
</div>
<div id="controls">
  <div class="label">반경</div>
  <div class="radiusRow">
    <button data-radius="500" class="active">500m</button>
    <button data-radius="750">750m</button>
    <button data-radius="1000">1000m</button>
  </div>
  <hr>
  <button id="trackBtn">위치 추적 OFF</button>
</div>
<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4049230daf71eeaa331a033be7ed6920&autoload=false&libraries=services"></script>
<script>
const DEFAULT_CENTER = { lat: 37.3800, lng: 126.8030 }; // 시흥시청 근처 fallback

let map, myPos = DEFAULT_CENTER, radius = 500, tracking = false, watchId = null;
let allShops = [];
let markers = [];
let infowindow;

function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function markerImage(grade) {
  const color = grade === "찐노포" ? "B4451F" : "D9822B";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40">
    <path d="M16 0C7 0 0 7 0 16c0 12 16 24 16 24s16-12 16-24C32 7 25 0 16 0z" fill="#${color}"/>
    <circle cx="16" cy="16" r="7" fill="#fff"/>
  </svg>`;
  const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  return new kakao.maps.MarkerImage(url, new kakao.maps.Size(32, 40), { offset: new kakao.maps.Point(16, 40) });
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

function renderMarkers() {
  clearMarkers();
  const inRange = allShops.filter(s => distanceM(myPos.lat, myPos.lng, s.lat, s.lng) <= radius);

  inRange.forEach(shop => {
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(shop.lat, shop.lng),
      image: markerImage(shop.grade),
      map,
    });

    kakao.maps.event.addListener(marker, "click", () => {
      const dirUrl = `https://map.kakao.com/link/to/${encodeURIComponent(shop.name)},${shop.lat},${shop.lng}`;
      const telHtml = shop.phone ? `<a href="tel:${shop.phone}">${shop.phone}</a>` : "정보 없음";
      const shareUrl = `https://map.kakao.com/link/map/${encodeURIComponent(shop.name)},${shop.lat},${shop.lng}`;
      const badgeColor = shop.grade === "찐노포" ? "var(--brick)" : "var(--orange)";
      infowindow.setContent(`
        <div style="padding:14px 16px;min-width:230px;max-width:260px;font-family:'Noto Sans KR',sans-serif;font-size:13px;line-height:1.7;color:var(--ink);background:var(--cream);">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px;">${shop.name}</span>
            <span style="background:${badgeColor};color:var(--cream);font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;">${shop.grade}</span>
          </div>
          <div style="color:#6B5C4E;font-size:12px;margin-top:2px;">${shop.category} · ${shop.yearsOpen}년째 영업</div>
          <hr style="border:none;border-top:1px solid var(--line);margin:10px 0;">
          <div>${shop.address}<br>전화: ${telHtml}</div>
          <div style="display:flex;gap:6px;margin-top:12px;">
            <a href="${dirUrl}" target="_blank" style="flex:1;text-align:center;border:2px solid var(--ink);border-radius:4px;padding:6px 4px;font-weight:700;font-size:12px;text-decoration:none;color:var(--ink);">길찾기</a>
            <a href="${shareUrl}" target="_blank" style="flex:1;text-align:center;background:var(--brick);border:2px solid var(--brick);border-radius:4px;padding:6px 4px;font-weight:700;font-size:12px;text-decoration:none;color:var(--cream);">카카오맵 공유</a>
          </div>
        </div>
      `);
      infowindow.open(map, marker);
    });

    markers.push(marker);
  });

  document.title = `노포맛집 지도 (${inRange.length}곳)`;
}

function setCenter(lat, lng) {
  myPos = { lat, lng };
  map.setCenter(new kakao.maps.LatLng(lat, lng));
  renderMarkers();
}

function initMap() {
  map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(myPos.lat, myPos.lng),
    level: 5,
  });
  infowindow = new kakao.maps.InfoWindow({ removable: true });

  fetch("data/노포_시흥시.json")
    .then(r => r.json())
    .then(data => {
      allShops = data;
      renderMarkers();
    });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => setCenter(pos.coords.latitude, pos.coords.longitude),
      () => renderMarkers() // 위치 거부 시 기본 위치로 진행
    );
  } else {
    renderMarkers();
  }
}

document.querySelectorAll("#controls button[data-radius]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#controls button[data-radius]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    radius = Number(btn.dataset.radius);
    renderMarkers();
  });
});

document.getElementById("trackBtn").addEventListener("click", function () {
  tracking = !tracking;
  this.textContent = tracking ? "위치 추적 ON" : "위치 추적 OFF";
  this.classList.toggle("on", tracking);

  if (tracking) {
    watchId = navigator.geolocation.watchPosition(
      pos => setCenter(pos.coords.latitude, pos.coords.longitude),
      err => console.error(err),
      { enableHighAccuracy: true }
    );
  } else if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
});

kakao.maps.load(initMap);
</script>
</body>
</html>
