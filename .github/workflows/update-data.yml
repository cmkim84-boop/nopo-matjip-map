name: 백년가게 데이터 갱신

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 백년가게 데이터 스크래핑
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/scrape_baeknyeon.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/노포_백년가게.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "백년가게 데이터 자동 갱신 ($(date +%Y-%m-%d))"
          git push
